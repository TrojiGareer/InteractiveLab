name: E2E Tests

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    name: Critical Playwright flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interactive_lab_test
          POSTGRES_USER: interactive_test
          POSTGRES_PASSWORD: interactive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U interactive_test -d interactive_lab_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://interactive_test:interactive_test@127.0.0.1:5432/interactive_lab_test
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start FastAPI
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/interactivelab-api.log 2>&1 &
          echo $! > /tmp/interactivelab-api.pid

      - name: Wait for FastAPI
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI is ready."
              exit 0
            fi

            sleep 2
          done

          echo "FastAPI did not become ready."
          cat /tmp/interactivelab-api.log
          exit 1

      - name: Verify database health
        run: curl --fail http://127.0.0.1:8000/health/db

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Show FastAPI logs on failure
        if: failure()
        run: cat /tmp/interactivelab-api.log