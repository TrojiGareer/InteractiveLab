name: Backend CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main", "feat/*" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      db-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interactive_lab_test
          POSTGRES_USER: interactive_test
          POSTGRES_PASSWORD: interactive_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U interactive_test -d interactive_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          cd backend
          python -m compileall app tests

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://interactive_test:interactive_test@127.0.0.1:5433/interactive_lab_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://interactive_test:interactive_test@127.0.0.1:5433/interactive_lab_test
        run: |
          cd backend
          pytest

      - name: Build Docker image
        run: |
          docker build -t interactivelab-api-check backend